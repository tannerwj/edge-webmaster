name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check that the committed dashboard matches its sources
        run: git diff --exit-code --stat -- src/frontend.gen.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run gates -- --with-size
      - run: npm run test:e2e
        env:
          CHROME_BIN: google-chrome
